<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Nexdir official logo — master file (Concept A: "Next Directory").
    A folder whose body carries a forward chevron: the next directory.
    All other logo assets are generated from this file by tools/branding/build-branding.mjs.
    The glyph stays inside a 400px radius of the centre so circular crops (Discord) keep it intact.
  -->
  <defs>
    <linearGradient id="nx-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B5BF7"/>
      <stop offset="1" stop-color="#12B5D6"/>
    </linearGradient>
    <mask id="nx-chevron-cut">
      <rect width="1024" height="1024" fill="#fff"/>
      <path d="M470 452 L574 548 L470 644" fill="none" stroke="#000" stroke-width="76" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect id="nx-tile" width="1024" height="1024" rx="224" fill="url(#nx-bg)"/>
  <path mask="url(#nx-chevron-cut)" fill="#fff"
        d="M284 292 H418 Q446 292 464 313 L494 348 H740 Q792 348 792 400 V700 Q792 752 740 752 H284 Q232 752 232 700 V344 Q232 292 284 292 Z"/>
</svg>
