# Dependency updates: weekly, grouped, a few open pull requests at a time. Every Dependabot pull
# request runs the same required CI checks as any other change (ruleset "Protect main"); nothing
# is merged automatically. Security updates (Dependabot alerts) are enabled separately.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cargo-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directories: [/tools/discord-setup, /tools/discord-notify]
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      python-tools:
        patterns: ["*"]
