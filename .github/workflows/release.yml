name: Release

# Started by hand only (Actions -> Release -> Run workflow), with an existing version tag such as
# v0.5.0-alpha.1. Builds the release files from that tag and creates a *draft* release, so a
# maintainer reviews everything before anything is published. Pushing a tag does not start it,
# and it refuses tags that already have a release, so files uploaded to an existing release
# (such as v0.4.3) are never replaced.
#
# Installers are signed for Nexdir's updater with the key in the repository secrets
# TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD (docs/updates/signing.md).
# Without them the build stops: unsigned update files are never released. Publishing the draft
# is a manual step; only then does the update-feed workflow offer the release to users.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build, e.g. v0.4.3
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # needed only to create the draft release
    steps:
      - name: Check the tag and that it has no release yet
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "Not a version tag: $env:TAG" }
          gh release view $env:TAG --repo $env:REPO *> $null
          if ($LASTEXITCODE -eq 0) { throw "A release for $env:TAG already exists; its files are not replaced." }
          $global:LASTEXITCODE = 0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      # The tag must match the version in tauri.conf.json, so a release can never ship
      # files with a different version number than its tag.
      - name: Check tag matches version
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:TAG -ne "v$version") { throw "Tag $env:TAG does not match version $version in tauri.conf.json" }

      - name: Check that update signing is set up
        shell: pwsh
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          $pubkey = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).plugins.updater.pubkey
          if (-not $pubkey) { throw "tauri.conf.json has no updater public key (plugins.updater.pubkey)." }
          if ($env:HAS_KEY -ne 'true') { throw "The TAURI_SIGNING_PRIVATE_KEY secret is missing; unsigned update files are not released." }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # Optional Discord invite for Help & Support: a repository *variable* (not a secret), e.g.
      # https://discord.gg/abc123. Empty means the Discord entry is shown as unavailable.
      # The signing key is only given to this step. tauri.release.conf.json turns on
      # createUpdaterArtifacts, which writes a .sig next to each installer; the key itself is
      # never written to disk or printed.
      - run: npx tauri build --config src-tauri/tauri.release.conf.json
        env:
          VITE_NEXDIR_DISCORD_INVITE: ${{ vars.NEXDIR_DISCORD_INVITE }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Every release has written notes; they become the release text and the updater shows them.
      - name: Release notes file
        id: notes
        shell: pwsh
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $path = "docs/release/notes-$($env:TAG.Substring(1)).md"
          if (-not (Test-Path $path)) { throw "Missing $path" }
          "path=$path" >> $env:GITHUB_OUTPUT

      # Same script as for local release builds (see docs/release/process.md).
      - name: Collect artifacts and checksums
        shell: pwsh
        run: ./tools/release/package.ps1 -OutDir out -RequireSignatures

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          # 0.x versions are alpha/beta: always marked as pre-release.
          prerelease: ${{ contains(inputs.tag, '-') || startsWith(inputs.tag, 'v0.') }}
          body_path: ${{ steps.notes.outputs.path }}
          files: out/*
