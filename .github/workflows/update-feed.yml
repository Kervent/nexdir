name: Update feed

# Keeps the update feeds (stable.json, preview.json on the `update-feed` branch) in line with
# the releases that are actually published. Runs when a release is published, edited,
# unpublished or deleted, or by hand. Drafts are never listed, and only releases whose installers
# verify against Nexdir's public update key are offered (tools/release/update_feed.py).
#
# Nexdir reads the feeds from
#   https://raw.githubusercontent.com/<owner>/<repo>/update-feed/stable.json
#   https://raw.githubusercontent.com/<owner>/<repo>/update-feed/preview.json
on:
  release:
    types: [published, edited, unpublished, deleted, prereleased, released]
  workflow_dispatch:

permissions:
  contents: read

# One feed update at a time, in order.
concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only to commit the two feed files to the update-feed branch
    steps:
      # The generator and the public key always come from main, never from a release tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build feeds from the published releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python tools/release/update_feed.py --repo "$REPO" --out "$RUNNER_TEMP/feed"
      - name: Commit the feeds to the update-feed branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/branch"
          git init -q "$work"
          cd "$work"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git fetch -q --depth 1 origin update-feed; then
            git checkout -q -b update-feed FETCH_HEAD
          else
            git checkout -q --orphan update-feed
          fi
          cp "$RUNNER_TEMP/feed/stable.json" "$RUNNER_TEMP/feed/preview.json" .
          printf '%s\n' "Nexdir update feeds, generated by .github/workflows/update-feed.yml." \
            "Do not edit by hand: the next release event overwrites them." > README.md
          git add stable.json preview.json README.md
          if git diff --cached --quiet; then
            echo "Feeds unchanged."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Update feeds ($EVENT $TAG)"
          git push -q origin update-feed
          echo "Feeds updated:"; cat stable.json preview.json | grep '"version"'
