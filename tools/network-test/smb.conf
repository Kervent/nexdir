# Nexdir SMB test server (temporary, dedicated WSL distro "nexdir-samba-test"). Not a production config.
[global]
   workgroup = WORKGROUP
   server string = Nexdir SMB test server
   netbios name = NEXDIRTEST
   interfaces = eth0
   bind interfaces only = yes
   disable netbios = yes
   smb ports = 445
   server min protocol = SMB3
   server signing = mandatory
   map to guest = Never
   restrict anonymous = 2
   usershare allow guests = no
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log file = /var/log/samba/nexdir-test.%m
   log level = 1
   unix extensions = no
   ea support = yes
   vfs objects = streams_xattr

[PublicTest]
   comment = Read/write test share
   path = /srv/nexdir-test/public
   read only = no
   valid users = nxtest nxprivate
   create mask = 0664
   directory mask = 0775

[PrivateTest]
   comment = Only nxprivate
   path = /srv/nexdir-test/private
   read only = no
   valid users = nxprivate

[ReadOnlyTest]
   comment = Read-only test share
   path = /srv/nexdir-test/readonly
   read only = yes
   valid users = nxtest nxprivate

[LargeFiles]
   comment = Performance test share
   path = /srv/nexdir-test/large
   read only = no
   valid users = nxtest
